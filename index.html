<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SLA Planner — Планировщик плановых работ</title>
    <script>
      // Тема до загрузки бандла — чтобы не было вспышки светлой темы при reload.
      // Приоритет: сохранённый выбор; иначе системная схема (как в ThemeContext).
      (function () {
        try {
          var saved = localStorage.getItem('sla_theme');
          var dark = saved === 'dark'
            || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
